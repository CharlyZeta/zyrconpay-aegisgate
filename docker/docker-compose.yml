version: '3.8'

services:
  # Redis for atomic event sets / state tracking
  redis:
    image: redis:7-alpine
    container_name: aegisgate-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Apache Kafka (KRaft mode - no Zookeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: aegisgate-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Auto-generate cluster ID if not provided
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  # HashiCorp Vault for multi-tenant dynamic secret storage
  vault:
    image: hashicorp/vault:1.15
    container_name: aegisgate-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroot"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
