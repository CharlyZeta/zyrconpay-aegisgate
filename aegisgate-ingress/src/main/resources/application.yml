server:
  port: 8081

spring:
  application:
    name: aegisgate-ingress
  
  # Virtual Threads enabled
  threads:
    virtual:
      enabled: true

  # Vault Configuration
  cloud:
    vault:
      enabled: true
      uri: http://localhost:8200
      # Dev-only root token. Override with VAULT_TOKEN in every other environment.
      token: ${VAULT_TOKEN:dev-root-token-change-me}
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: aegisgate

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

