server:
  port: 8082

spring:
  application:
    name: aegisgate-orchestrator

  # Virtual Threads enabled
  threads:
    virtual:
      enabled: true

  # Vault Configuration
  cloud:
    vault:
      enabled: true
      uri: http://localhost:8200
      token: myroot
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: aegisgate

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aegisgate-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.zyrconpay.aegisgate.common.dto"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

