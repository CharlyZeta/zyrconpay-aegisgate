server:
  port: 8082

spring:
  application:
    name: aegisgate-orchestrator

  # Virtual Threads enabled
  threads:
    virtual:
      enabled: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aegisgate-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.zyrconpay.aegisgate.common.dto"
